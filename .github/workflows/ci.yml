# CI 校验 / Continuous Integration
# 防止配置/脚本破坏：模板渲染、Python/bash/PowerShell 代码质量
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1. Chezmoi 模板渲染校验：防止模板语法错误破坏整机配置
  chezmoi:
    name: Chezmoi template validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          curl -fsSL https://get.chezmoi.io | sh
          chezmoi_path=$(find "$HOME" -name chezmoi -type f 2>/dev/null | head -1)
          echo "Found chezmoi: ${chezmoi_path}"
          echo "$(dirname "${chezmoi_path}")" >> "$GITHUB_PATH"
      - name: Render all templates
        run: |
          set -euo pipefail
          for t in $(git ls-files '*.tmpl'); do
            echo "Rendering $t"
            chezmoi execute-template --init \
              --override-data '{"name":"CI","email":"ci@example.com","editor":"nvim","aria2RpcSecret":"ci-secret"}' \
              < "$t" > /dev/null
          done

  # 2. Python lint (ruff)
  python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install ruff
        run: uv tool install ruff
      - name: Run ruff
        run: ruff check scripts/

  # 3. Shell lint (shellcheck)
  shell:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          mapfile -t sh_files < <(find scripts dot_local/bin -name '*.sh' -type f)
          shellcheck -x -S warning "${sh_files[@]}"

  # 4. PowerShell lint (PSScriptAnalyzer)
  powershell:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path scripts/windows-quickstart -Recurse

  # 5. Pester 单元测试（Windows quickstart 包清单 / dry-run）
  pester:
    name: PowerShell unit tests (Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0.0
          $result = Invoke-Pester -Path scripts/tests/PackageManifest.Tests.ps1 -PassThru -Output Normal
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed" }

  # 6. Bash 单元测试（公共库 read_pkg_list 等）
  bash-tests:
    name: Bash unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run bash tests
        run: bash scripts/tests/test-quickstart-common.sh
