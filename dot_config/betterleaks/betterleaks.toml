# Betterleaks 全局配置 / global config
#
# 由 chezmoi 部署到：
#   WSL     : ~/.config/betterleaks/betterleaks.toml
#   Windows : C:\Users\<user>\.config\betterleaks\betterleaks.toml
# 两端同一源文件、同一目标路径（Windows 侧 XDG_CONFIG_HOME 已指向 ~/.config）。
#
# betterleaks 自身不会自动发现该路径（无 XDG 自动发现、也不读工程内
# .betterleaks.toml），必须由 mise [env] 导出的 BETTERLEAKS_CONFIG 显式指向。
# / betterleaks does NOT auto-discover this path; it is located via the
# BETTERLEAKS_CONFIG env var exported by mise [env].
#
# 手动指定时用绝对路径（`~` 不会被展开）：
#   betterleaks -c /home/<user>/.config/betterleaks/betterleaks.toml ...
#   betterleaks -c C:\Users\<user>\.config\betterleaks\betterleaks.toml ...

# 版本下限：必须写在所有表头之前
# 当前 betterleaks 为预发布版，故此处与安装版本保持一致；
# 若升级到正式版 v2.0.0，可同步上调。
# Version floor; MUST appear before any table header.
minVersion = "v2.0.0-rc.1"

# 继承内嵌默认规则集（465 条）。自定义配置不会自动继承默认规则，
# 必须显式 extend，否则只剩本文件里写的规则。
# 该文件当前不追加自定义规则，因此 config hash 与内嵌默认完全一致，
# 行为与直接用默认配置完全相同 —— 它的作用是给出一个稳定的自定义落点。
# [extend] is mandatory: a custom config inherits NOTHING by default.
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# 自定义扩展落点 / where to add your own rules
#
# 生产建议（官方文档）：维护自己的规则集，不要直接改上游默认配置，
# 这样规则集在升级之间保持稳定，新规则可以先审阅再采纳。
# 做法：把新增规则**追加**在本文件末尾（[extend] 之后），而不是覆盖默认。
#
# 注意：顶层的 minVersion / prefilter / filter 必须写在 `[extend]` 等
# 任何表头**之前**，否则会被解析成 extend.<key> 并直接报错：
#   FTL unable to load config error="... unknown configuration fields:
#   extend.prefilter ...: strict mode: fields in the document are missing
#   in the target struct"
# 另：顶层 prefilter / filter 与默认值是**取并集**而非替换，且其谓词
# 方向语义未完全确认，故本文件刻意不覆盖它们。
#
# [[rules]]
# id = "example-internal-token"
# description = "内部临时令牌 / internal temporary token"
# regex = '''EXAMPLETOK_[A-Za-z0-9]{32}'''
# keywords = ["EXAMPLETOK_"]
#
# 规则级过滤（Expr，在正则命中后执行，可访问 finding 与 attributes）：
# filter = '''!finding["path"].contains("fixtures")'''
# ---------------------------------------------------------------------------
