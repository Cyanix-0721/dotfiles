[tools]
java = "temurin-17"
go = "1.27"
# betterleaks 2.x 仅发布预发布版;必须写完整版本号
# 注意:`2.0` / `latest` 均无法解析到 2.x(latest 会退回 1.8.1),不要改写成模糊范围
# betterleaks 2.x is prerelease-only; the full version string is required.
# `2.0` / `latest` do NOT resolve to 2.x (`latest` falls back to 1.8.1) -- do not loosen this.
betterleaks = "2.0.0-rc.1"

[env]
# betterleaks 不会自动发现 XDG 路径或工程内 .betterleaks.toml,必须显式指向配置文件。
# {{env.HOME}} 在 Windows 上未定义会直接报错,故用 default() 回退到 USERPROFILE。
# betterleaks has no XDG / in-repo config auto-discovery; the path must be explicit.
# {{env.HOME}} is undefined on Windows, hence the USERPROFILE fallback.
BETTERLEAKS_CONFIG = "{{env.HOME | default(value=env.USERPROFILE)}}/.config/betterleaks/betterleaks.toml"

# Windows 侧 betterleaks 的 git 扫描依赖一个小垫片（把 GIT_CONFIG_GLOBAL=NUL 改写成 nul，
# 见 dot_local/share/git-shim/git.cmd 与 betterleaks#352 / git-for-windows#6449）。
# mise 会把 _.path 前置进 PATH，这样垫片能抢在 scoop 的 git.exe 之前命中。
#
# 用 os() 限定只在 Windows 生效（mise 官方模板函数，见 docs/templates.md），
# 否则 WSL 侧会白留一条指向不存在目录的死路径。
# os() 不成立时该值是空串 —— mise 会丢弃空条目；这一条是关键：
# 空的 PATH 项等于「当前目录」，绝不能留。
# Windows-only via os(): mise dropping the empty entry is load-bearing, since an
# empty PATH entry would mean the current directory.
_.path = ["{% if os() == 'windows' %}{{env.HOME | default(value=env.USERPROFILE)}}/.local/share/git-shim{% endif %}"]
