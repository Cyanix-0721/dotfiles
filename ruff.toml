# Ruff 配置（Python lint + format）/ Ruff configuration (lint + format)
# 只处理 scripts/ 下的 Python 脚本
# 安装: uv tool install ruff  或  pip install ruff

target-version = "py39"
line-length = 100
include = ["scripts/**/*.py"]

[lint]
# E/F/W 基础错误，I import 排序，UP pyupgrade，B bugbear，SIM 简化
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[format]
quote-style = "double"
indent-style = "space"
